<!-- Button trigger modal -->

<div class="modal-content">
    <div class="modal-header text-center">
        <span class="text-center"><strong class="text-center">Vista previa de pedido</strong></span>
    </div>
    <div class="modal-body" name="modalDataPreviewer" id="previewOrder">
        <iframe id="pdf_preview_iframe" type="application/pdf" ng-src="{{UrlString}}" style="width:600px; height:800px;" frameborder="0"></iframe>
    </div>
    <div class="modal-footer">
        <div class="row">
            <div class="col-lg-5 col-lg-offset-6">
                <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="ok()">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
