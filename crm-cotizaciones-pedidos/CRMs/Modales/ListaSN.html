<div class="modal-header">
    <h4 class="modal-title">Lista de socios de negocio</h4>
</div>
<div class="modal-body" name="modalData">
    <div class="row">
        <div class="col-lg-12 col-md-12 row form-group-sm rowFormulario2">
            <label class="col-lg-2 col-md-2 col-sm-2">Buscar</label>
            <div class="col-lg-5 col-md-5 col-sm-5" style="margin-bottom: 20px;">
                <input ng-model="QueryBusquedaSN" id="search" class="form-control" placeholder="Filtrar por">
            </div>

            <label class="col-lg-2 col-md-2 col-sm-2">Páginas</label>
            <div class="col-lg-2 col-md-2 col-sm-2">
                <input type="number" min="1" max="100" class="form-control" ng-model="QtyPageViewSN">
            </div>
        </div>
        <div class="col-lg-12 col-md-12">
            <!--<table id="modTabSN" class="table table-bordered bordered table-striped table-hover table-condensed datatable" ui-jq="dataTable" ui-options="dataTableOpt">-->
            <table id="modTabSN" class="table table-bordered bordered table-striped table-hover table-condensed datatable tablaModal">
                <thead style="background-color: lightgray;">
                    <tr style="margin:0; padding:0;">
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>L. Precio</th>
                        <!--<th>Seleccionar</th>-->
                    </tr>
                </thead>
                <tbody style="background-color:#FAFAFA;">
                    <tr dir-paginate="socio in ListaSN |orderBy:sortKey:reverse|filter:QueryBusquedaSN|itemsPerPage:QtyPageViewSN" pagination-id="ListSNToOrder" class="pointerCursor">
                        <td style="text-align:center" ng-click="SocioSeleccionado(socio);">
                            {{socio.CardCode}}
                        </td>
                        <td style="text-align:center" ng-click="SocioSeleccionado(socio);">
                            {{socio.CardName}}
                        </td>
                        <td style="text-align:center" ng-click="SocioSeleccionado(socio);">
                            {{socio.ListNum}}
                        </td>
                        <!--<td style="text-align:center" ng-click="SocioSeleccionado(ListaSN[$index]);">
                           Editar
                        </td>-->
                    </tr>

                </tbody>
            </table>
            <dir-pagination-controls max-size="7"
                                     direction-links="true"
                                     boundary-links="true" pagination-id="ListSNToOrder">
            </dir-pagination-controls>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-5 col-lg-offset-6">
            <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="ok()">Cancelar</button>
        </div>
    </div>
</div>
