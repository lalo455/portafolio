<div class="modal-header text-center">
    <h4 class="modal-title">Lista de inventario </h4>
</div>
<div class="modal-body" name="modalData">
    <div class="row">
        <div class="col-lg-12 col-md-12 row form-group-sm rowFormulario2">
            <label class="col-lg-2 col-md-2 col-sm-2">Buscar</label>
            <div class="col-lg-9 col-md-9 col-sm-9" style="margin-bottom: 20px;">
                <input ng-model="QueryBusquedaItem" id="search" class="form-control" placeholder="Filtrar por">
                <!--<div class="col-lg-2 col-md-2 col-sm-2">
                    <label>Páginas</label>
                </div>
                <div class="col-lg-3 col-md-3 col-sm-3">
                    <input type="number" min="1" max="100" class="form-control" ng-model="QtyPageViewItem">
                </div>-->
                <!--<div class="col-lg-3 col-md-3 col-sm-3">
                    <label for="selectmany">Multiselección</label>
                    <input ng-model="Multiseleccion" id="selectmany" type="checkbox" class="input-group">
                </div>-->
            </div>
        </div>
        <div class="col-lg-20 col-md-20">
            <!--<table id="modTabITEM" class="table table-bordered bordered table-striped table-hover table-condensed datatable" ui-jq="dataTable" ui-options="dataTableOpt">-->
            <table id="modTabITEM" class="table table-bordered bordered table-striped table-hover table-condensed datatable tablaModal">
                <thead style="background-color: lightgray;">
                    <tr>
                        <th>Almacén</th>
                        <th>Stock</th>
                        <th>Comprometido</th>
                    </tr>
                </thead>
                <tbody style="background-color:#FAFAFA;">
                    <tr dir-paginate="item in ListaITEM |orderBy:sortKey:reverse|filter:QueryBusquedaItem|itemsPerPage:QtyPageViewItem" class="pointerCursor" pagination-id="ListItemToOrder">

                        <td style="text-align:center" ng-click="ItemSeleccionado(ListaITEM[$index]);">
                            {{item.Almacen}}
                        </td>


                        <td style="text-align:center" ng-click="ItemSeleccionado(ListaITEM[$index]);">
                            {{item.stock |number:0}}
                        </td>
                        <td ng-click="ItemSeleccionado(ListaITEM[$index]);">
                            {{item.comprometido |number:0}}
                        </td>
                    </tr>

                </tbody>
            </table>
            <dir-pagination-controls max-size="8"
                                     direction-links="true"
                                     boundary-links="true" pagination-id="ListItemToOrder">
            </dir-pagination-controls>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-5 col-lg-offset-6">
            <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="ok()">Cerrar</button>
        </div>
    </div>
</div>
