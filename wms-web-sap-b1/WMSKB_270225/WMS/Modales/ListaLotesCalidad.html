<div class="modal-header">
    <h4 class="modal-title">Lista de Lotes</h4>
</div>
<div class="modal-body" name="modalData">
    <div class="row">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="megaTras">
                <table class='headerTras'>
                    <tr style="margin:0; padding:0;">            
                        <td style="color: white;" class="colTH2">Lote</td>
                        <td style="color: white;" class="colTH3">Artículo</td>
                        <td style="color: white;" class="colTH5">Almacén</td>
                        <td style="color: white;" class="colTH5">Stock</td>
                    </tr>
                </table>
                <table style="width:100%; margin-top:40px;">
                    <tbody>
                        <tr ng-repeat="lt in LotesList" style="display: table; table-layout:fixed; width: 100%;">
                            <td class="colTT2" ng-click="LoteSeleccionado(lt);">{{lt.Name}}</td>
                            <td class="colTT3" ng-click="LoteSeleccionado(lt);">{{lt.U_ItemCode}}</td>
                            <td class="colTT5" ng-click="LoteSeleccionado(lt);">{{lt.WhsCode}}</td>
                            <td class="colTT5" ng-click="LoteSeleccionado(lt);">{{lt.U_QtyEti}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-5 col-lg-offset-6">
            <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="ok()">Cancelar</button>
        </div>
    </div>
</div>
