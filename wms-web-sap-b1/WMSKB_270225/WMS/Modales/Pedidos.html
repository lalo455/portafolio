<div class="modal-header">
    <h4 class="modal-title">Pedidos Abiertos</h4>
</div>
<div class="modal-body" name="modalData">
    <div class="row">
        <div class="col-lg-12 col-md-12">
            <table id="modTagTab" class="table table-bordered bordered table-striped table-condensed datatable">
                <thead style="background-color: #DAA520;">
                    <tr style="margin:0; padding:0;">
                        <th style="text-align:center">N° Pedido</th>
                        <th style="text-align:center">Referencia</th>
                        <th style="text-align:center">Fecha</th>
                    </tr>
                </thead>
                <tbody style="background-color:#FAFAFA;">
                    <tr ng-repeat="ped in Pedidos">
                        <td style="text-align:center" ng-click="PedidoSeleccionado(Pedidos[$index]);">
                            {{ped.DocNum}}
                        </td>
                        <td style="text-align:center" ng-click="PedidoSeleccionado(Pedidos[$index]);">
                            {{ped.NumAtCard}}
                        </td>
                        <td style="text-align:center" ng-click="PedidoSeleccionado(Pedidos[$index]);">
                            {{ped.DocDate | date:"MM/dd/yyyy"}}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div class="modal-footer">
    <div class="row">
        <div class="col-lg-5 col-lg-offset-6">
            <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="ok()">Cancelar</button>
        </div>
    </div>
</div>
